<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="VibeFlow OS pipeline: request, spec, plan, code, review by a different agent which can send work back, then ship.">
  <style>.a{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(0.22, 1, 0.36, 1);opacity:0}@keyframes h0{0%,0.0%{opacity:0}1.5%,92%{opacity:1}97%,100%{opacity:0}}.h0{animation-name:h0}@keyframes h1{0%,11.31%{opacity:0}12.81%,92%{opacity:1}97%,100%{opacity:0}}.h1{animation-name:h1}@keyframes h2{0%,22.63%{opacity:0}24.13%,92%{opacity:1}97%,100%{opacity:0}}.h2{animation-name:h2}@keyframes h3{0%,33.94%{opacity:0}35.44%,92%{opacity:1}97%,100%{opacity:0}}.h3{animation-name:h3}@keyframes rw{0%,45.25%{opacity:0}46.75%,63.37%{opacity:1}68.37%,100%{opacity:0}}.rw{animation-name:rw}@keyframes fx{0%,46.25%{opacity:0}47.75%,65.37%{opacity:1}70.37%,100%{opacity:0}}.fx{animation-name:fx}@keyframes rk{0%,70.69%{opacity:0}72.19%,92%{opacity:1}97%,100%{opacity:0}}.rk{animation-name:rk}@keyframes sh{0%,82.0%{opacity:0}83.5%,92%{opacity:1}97%,100%{opacity:0}}.sh{animation-name:sh}@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.rw,.fx,.tok{display:none}}</style>
  <rect x="0.5" y="0.5" width="1199" height="219" rx="12" fill="#07090D" stroke="#1A1E26"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><line x1="100" y1="118" x2="1100" y2="118" stroke="#262B35" stroke-width="2"/><g class="a fx"><path d="M900 118 C860 34 740 34 700 118" fill="none" stroke="#F2B66B" stroke-width="1.6" stroke-dasharray="5 5"/><text x="800" y="44" text-anchor="middle" font-size="14" fill="#F2B66B">changes requested</text></g><circle cx="100" cy="118" r="8" fill="#07090D" stroke="#7A818D" stroke-width="1.6"/><text x="100" y="160" text-anchor="middle" font-size="18" font-weight="600" fill="#E9ECF1">Request</text><text x="100" y="182" text-anchor="middle" font-size="14" fill="#7A818D">in plain words</text><circle class="a h0" cx="100" cy="118" r="8" fill="#5CB8F0"/><circle cx="300" cy="118" r="8" fill="#07090D" stroke="#7A818D" stroke-width="1.6"/><text x="300" y="160" text-anchor="middle" font-size="18" font-weight="600" fill="#E9ECF1">Spec</text><text x="300" y="182" text-anchor="middle" font-size="14" fill="#7A818D">what done means</text><circle class="a h1" cx="300" cy="118" r="8" fill="#5CB8F0"/><circle cx="500" cy="118" r="8" fill="#07090D" stroke="#7A818D" stroke-width="1.6"/><text x="500" y="160" text-anchor="middle" font-size="18" font-weight="600" fill="#E9ECF1">Plan</text><text x="500" y="182" text-anchor="middle" font-size="14" fill="#7A818D">tasks, tests first</text><circle class="a h2" cx="500" cy="118" r="8" fill="#5CB8F0"/><circle cx="700" cy="118" r="8" fill="#07090D" stroke="#7A818D" stroke-width="1.6"/><text x="700" y="160" text-anchor="middle" font-size="18" font-weight="600" fill="#E9ECF1">Code</text><text x="700" y="182" text-anchor="middle" font-size="14" fill="#7A818D">agents in parallel</text><circle class="a h3" cx="700" cy="118" r="8" fill="#5CB8F0"/><circle cx="900" cy="118" r="8" fill="#07090D" stroke="#7A818D" stroke-width="1.6"/><text x="900" y="160" text-anchor="middle" font-size="18" font-weight="600" fill="#E9ECF1">Review</text><text x="900" y="182" text-anchor="middle" font-size="14" fill="#7A818D">a different agent</text><circle cx="1100" cy="118" r="8" fill="#07090D" stroke="#7A818D" stroke-width="1.6"/><text x="1100" y="160" text-anchor="middle" font-size="18" font-weight="600" fill="#E9ECF1">Ship</text><text x="1100" y="182" text-anchor="middle" font-size="14" fill="#7A818D">TestFlight, prod</text><circle class="a rw" cx="900" cy="118" r="8" fill="#F2B66B"/><circle class="a rk" cx="900" cy="118" r="8" fill="#5CB8F0"/><g class="a sh"><circle cx="1100" cy="118" r="13" fill="#5CB8F0"/><path d="M1094 118 l4 4 l8 -8" fill="none" stroke="#07090D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><circle class="tok" r="5" fill="#E9ECF1"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.82;1" path="M100 118 H900 C860 34 740 34 700 118 H1100"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.82;0.84;1"/></circle></g>
</svg>
